name: format

# Every Swift file here is swiftformat's output, and this job is what enforces
# it. `.githooks/pre-commit` formats on the way in for anyone who ran
# `git config core.hooksPath .githooks`; nobody can be assumed to have.
#
# Pull requests do not trigger this, for the reason given in test.yml.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  swift:
    name: swiftformat --lint
    # macOS, and it is about time rather than platform. SwiftFormat gives each
    # rule one second per file — `timeout: TimeInterval = 1` in Options.swift,
    # with no flag to raise it — and the statically linked Linux build spends
    # longer than that on organizeDeclarations over the larger files here. Every
    # run failed with "organizeDeclarations rule timed out" on around twenty of
    # them while nothing in the tree was misformatted. The macOS binary takes
    # roughly 300ms on the slowest of them.
    runs-on: [self-hosted, macOS, ARM64, tartelet]
    steps:
      - uses: actions/checkout@v7.0.1

      # No install step: the runner image carries SwiftFormat. `--min-version`
      # in .swiftformat is what refuses a build that ever ships an older one
      # rather than letting the image disagree quietly with the hook.
      #
      # `--reporter github-actions-log` puts each violation on the line it is on
      # in the diff, so a contributor reads the finding rather than the log.
      - name: Check formatting
        run: |
          swiftformat --version
          if ! git ls-files -z '*.swift' | xargs -0 -n "$(getconf _NPROCESSORS_ONLN)" -P 1 \
            swiftformat --config .swiftformat --lint --reporter github-actions-log; then
            echo "::error::Swift files are not formatted. Run: swiftformat . --config .swiftformat"
            exit 1
          fi
