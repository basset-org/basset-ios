name: test

# Pull requests do not trigger this. A fork supplies both the workflow file and
# the code it runs, and the runners here are physical machines rather than
# throwaway cloud VMs, so a run is started by pushing a branch to this
# repository — which only a writer can do. A contributed pull request is tested
# by pushing its commits to a branch here after reading them.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    # The name is a contract: branch protection requires `simulator (oldest)`
    # and `simulator (newest)` by name, and a matrix that adds anything else to
    # the generated name leaves those two contexts permanently unreported, which
    # blocks every merge rather than failing anything.
    name: simulator (${{ matrix.runtime }})
    runs-on: [self-hosted, macOS, ARM64, tartelet]
    strategy:
      fail-fast: false
      matrix:
        runtime: [oldest, newest]
    steps:
      - uses: actions/checkout@v4

      # The deployment floor is what the catalog claims to support, and it is
      # not what the newest installed runtime tests. A control-plane timestamp
      # carrying six fractional digits parsed on iOS 26 and returned nil on
      # 18.6, so every device below the runtime the tests happened to use
      # decoded no requests at all and reported nothing — which reads exactly
      # like a fleet nobody asked anything of.
      #
      # Chosen from what the machine has rather than pinned, so an image that
      # drops a runtime fails by testing a different version rather than by
      # failing to find one.
      - name: Choose a simulator
        id: simulator
        run: |
          floor=$(sed -n 's/.*\.iOS(\.v\([0-9]*\)).*/\1/p' Package.swift)
          udid=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          floor = int('$floor')
          want = '${{ matrix.runtime }}'
          runtimes = json.load(sys.stdin)['devices']
          usable = {}
          for identifier, devices in runtimes.items():
              if 'iOS' not in identifier or not devices:
                  continue
              version = identifier.rsplit('.', 1)[-1].removeprefix('iOS-')
              major = int(version.split('-')[0])
              if major >= floor:
                  usable[tuple(int(part) for part in version.split('-'))] = devices[0]['udid']
          if not usable:
              sys.exit('no installed iOS runtime meets the %d floor' % floor)
          key = min(usable) if want == 'oldest' else max(usable)
          print('.'.join(str(part) for part in key), usable[key], sep='\t')
          ")
          echo "version=$(echo "$udid" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "udid=$(echo "$udid" | cut -f2)" >> "$GITHUB_OUTPUT"

      # Both runtimes come from one machine image, so an image built without the
      # floor runtime installed narrows the matrix to two runs of the newest one
      # without failing — which reads as a green run over a version nobody
      # tested. The oldest job says which runtime it got and refuses one that is
      # not old.
      - name: Refuse a matrix that quietly narrowed
        if: matrix.runtime == 'oldest'
        run: |
          major=$(echo "${{ steps.simulator.outputs.version }}" | cut -d. -f1)
          floor=$(sed -n 's/.*\.iOS(\.v\([0-9]*\)).*/\1/p' Package.swift)
          echo "oldest installed runtime: iOS ${{ steps.simulator.outputs.version }}, floor: iOS $floor"
          if [ "$major" -gt "$((floor + 1))" ]; then
            echo "::error::the oldest installed runtime is iOS $major against a floor of $floor, so this image tests none of the versions the floor exists for"
            exit 1
          fi

      # Two virtual machines share one host; the races job runs these unconstrained.
      - name: Test on iOS ${{ steps.simulator.outputs.version }}
        env:
          TEST_RUNNER_BASSET_SHARED_SIMULATOR: "true"
        run: |
          xcodebuild test \
            -scheme Basset-Package \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath "${{ runner.temp }}/test.xcresult"

      # Once, not per leg: a generic/platform=iOS build resolves the same
      # iPhoneOS SDK and the same deployment floor whichever simulator runtime
      # the leg chose, so the second run compiles identical inputs.
      - name: Build for a device
        if: matrix.runtime == 'newest'
        run: |
          xcodebuild build \
            -scheme Basset \
            -destination 'generic/platform=iOS' -quiet

  # A data race in a library that runs inside somebody else's app is that app's
  # crash, and the suite stayed green through three of them: the observer list
  # a thunk walked while another thread freed it, the KVO registration two
  # threads could remove twice, and the camera arrays a follower and the runner
  # queue mutated at once. None of them failed a test. All of them failed here.
  #
  # ThreadWalkerTests is skipped rather than fixed. It suspends every thread in
  # the process to walk their stacks, and a thread suspended while holding one
  # of ThreadSanitizer's own runtime locks never gives it back — the suite
  # deadlocks instead of failing. The mechanism it covers is exercised by the
  # simulator jobs above.
  #
  # The suite, not the file it lives in: skipping by file name takes
  # BinaryImageTests and ReadingsSiblingTests with it, and neither suspends
  # anything.
  races:
    runs-on: [self-hosted, macOS, ARM64, tartelet]
    steps:
      - uses: actions/checkout@v4

      - name: Test under ThreadSanitizer
        run: swift test --sanitize=thread --skip ThreadWalkerTests
