# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json

# REVIEW.md is the standard, for cubic and for people both. It is wired in as a
# file-backed rule rather than restated here, so there is one place to correct
# the reviewer when it is wrong about this repository.
version: 1

reviews:
  enabled: true
  sensitivity: medium
  incremental_commits: true
  resolve_threads_when_addressed: true
  ultrareview: manual

  # An outside contributor has not read anything here. Their pull requests get
  # a human before the review is taken as read.
  external_contributors_require_manual_review: true

  custom_rules:
    - name: SDK conventions
      description: >-
        This code runs inside somebody else's app and is read by strangers.
        Hold the change to both: nothing that can take the host process down,
        no unbounded work, no hook that outlives its instrument, and no claim a
        reader holding only this repository cannot check.
      file_paths:
        - REVIEW.md

pr_descriptions:
  generate: true
  skip_if_author_description: true
  instructions: |
    Written for someone who has only this repository checked out. Never
    reference a document, path, or discussion outside it.

    `## Summary` in 1-3 bullets: why, not what — the diff already says what.

    `## Code paths` instead of a test plan: what actually runs this code on a
    device — which instrument, which framework callback, which transport. It
    tells the reviewer the blast radius inside a host app.

issues:
  fix_with_cubic_buttons: true
  pr_comment_fixes: true
